# === Server Settings ===
server:
  port: 8080
  servlet:
    context-path: /myapp

# === Spring Security JWT Resource Server ===
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://dev-58281825.okta.com/oauth2/default/v1/keys

  # === CORS Configuration ===
  web:
    cors:
      allowed-origins:
        - https://myfrontend.com
        - https://admin.myapp.io
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true

  # === DevTools ===
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources
      exclude: static/**,public/**
    livereload:
      enabled: true
      port: 35729
    remote:
      debug:
        enabled: true
        local-port: 8000

# === Okta OAuth2 Configuration ===
okta:
  client-id: 0oao2i1pl9JIJEUVe5d7
  client-secret: wXQ8LfiecMX-xV_m2d-bnX9-iN9jwCIjF5Q8gXQM6SG8ZXT0UGpaJOhznhJ4gSng
  scope: openid,profile,email
  authorization-uri: https://dev-58281825.okta.com/oauth2/default/v1/authorize
  token-uri: https://dev-58281825.okta.com/oauth2/default/v1/token
  user-info-uri: https://dev-58281825.okta.com/oauth2/default/v1/userinfo
  user-name-attribute: preferred_username
  redirect-uri: http://localhost:8080/myapp/login/oauth2/code/okta
  jwk-set-uri: https://dev-58281825.okta.com/oauth2/default/v1/keys
  issuer-uri: https://dev-58281825.okta.com/oauth2/default
  authorization-grant-type: authorization_code

# === Logging Configuration ===
logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:TRACE}
    org.springframework.web: TRACE
    org.springframework.boot.autoconfigure: DEBUG
  pattern:
    console: ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# === Custom Security Rules ===
security:
  oauth2:
    enabled: true
    permit-all:
      - /
      - /health
      - /public/**
    authority-rules:
      /api/secure/**:
        - ROLE_USER
    allowed-origins:
      - https://myfrontend.com
      - https://admin.myapp.io

# === Actuator & Health ===
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

health-check-uri: /health
