# === Server Settings ===
server.port=8080
server.servlet.context-path=/myapp

# === Spring Security JWT Resource Server ===
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev-58281825.okta.com/oauth2/default/v1/keys

# === CORS Configuration ===
spring.web.cors.allowed-origins[0]=https://myfrontend.com
spring.web.cors.allowed-origins[1]=https://admin.myapp.io
spring.web.cors.allowed-methods[0]=GET
spring.web.cors.allowed-methods[1]=POST
spring.web.cors.allowed-methods[2]=PUT
spring.web.cors.allowed-methods[3]=DELETE
spring.web.cors.allowed-methods[4]=OPTIONS
spring.web.cors.allowed-headers[0]=*
spring.web.cors.allow-credentials=true

# === DevTools ===
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
spring.devtools.remote.debug.enabled=true
spring.devtools.remote.debug.local-port=8000

# === Okta OAuth2 Configuration ===
okta.client-id=0oao2i1pl9JIJEUVe5d7
okta.client-secret=wXQ8LfiecMX-xV_m2d-bnX9-iN9jwCIjF5Q8gXQM6SG8ZXT0UGpaJOhznhJ4gSng
okta.scope=openid,profile,email
okta.authorization-uri=https://dev-58281825.okta.com/oauth2/default/v1/authorize
okta.token-uri=https://dev-58281825.okta.com/oauth2/default/v1/token
okta.user-info-uri=https://dev-58281825.okta.com/oauth2/default/v1/userinfo
okta.user-name-attribute=preferred_username
okta.redirect-uri=http://localhost:8080/myapp/login/oauth2/code/okta
okta.jwk-set-uri=https://dev-58281825.okta.com/oauth2/default/v1/keys
okta.issuer-uri=https://dev-58281825.okta.com/oauth2/default
okta.authorization-grant-type=authorization_code

# === Logging Configuration ===
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# === Custom Security Rules ===
security.oauth2.enabled=true
security.oauth2.permit-all[0]=/
security.oauth2.permit-all[1]=/health
security.oauth2.permit-all[2]=/public/**
security.oauth2.authority-rules./api/secure/**[0]=ROLE_USER
security.oauth2.allowed-origins[0]=https://myfrontend.com
security.oauth2.allowed-origins[1]=https://admin.myapp.io

# === Actuator & Health ===
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

health-check-uri=/health
